<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Verify GitHub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #111111);
    --muted: var(--tg-theme-hint-color, #6b7280);
    --accent: var(--tg-theme-button-color, #2f6df5);
    --accent-fg: var(--tg-theme-button-text-color, #ffffff);
    --section: var(--tg-theme-secondary-bg-color, #f3f4f6);
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    min-height: 100dvh;
  }
  .card {
    width: 100%; max-width: 420px; text-align: center;
    background: var(--section); border-radius: 18px; padding: 28px 22px;
  }
  .logo { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 14px; display: flex;
    align-items: center; justify-content: center; background: #181a1f; color: #fff; font-weight: 800; font-size: 26px; }
  h1 { font-size: 19px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  button {
    width: 100%; border: none; border-radius: 12px; padding: 14px 16px;
    background: var(--accent); color: var(--accent-fg); font-size: 16px; font-weight: 600;
    cursor: pointer; transition: transform .05s ease, opacity .2s ease;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .55; cursor: default; }
  .status { margin-top: 16px; font-size: 14px; color: var(--muted); min-height: 20px; }
  .err { color: var(--danger); }
  a { color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">GH</div>
    <h1>Verify your GitHub account</h1>
    <p>This group requires a verified GitHub account to join.</p>
    <button id="action" disabled>Verify with GitHub</button>
    <div class="status" id="status">Starting…</div>
  </div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status");
  var btn = $("action");

  function setStatus(text, cls) {
    statusEl.textContent = text || "";
    statusEl.className = "status" + (cls ? " " + cls : "");
  }
  function fail(msg) {
    setStatus(msg, "err");
    btn.disabled = true;
    btn.textContent = "Cannot continue";
  }

  var initData = (tg && tg.initData) || "";
  if (!initData) { fail("No Telegram identity. Open this from the group join request."); return; }

  var authorizeUrl = null;

  // No polling: the outcome is shown in the browser tab GitHub opens for OAuth.
  // After the user taps, we point them there; the join request is resolved
  // server-side. The button stays enabled so they can retry on a transient error.
  function openGithub() {
    if (!authorizeUrl) return;
    var opened = false;
    if (tg && tg.openLink) {
      try { tg.openLink(authorizeUrl, { try_instant_view: false }); opened = true; } catch (e) {}
    }
    if (!opened) window.location.href = authorizeUrl;
    setStatus("Finish the sign-in in your browser, then close this window. " +
              "If approved, you'll be added to the group automatically.");
    btn.textContent = "Open GitHub again";
  }

  btn.addEventListener("click", openGithub);

  // Validate the Telegram-signed initData (which carries the join-request context)
  // and get the GitHub authorize URL. initData doubles as the OAuth `state`.
  fetch("/github/oauth", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ initData: initData }),
  })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) { fail(j.error || "Verification could not start."); return; }
      authorizeUrl = j.authorizeUrl;
      btn.disabled = false;
      setStatus("Tap the button to sign in with GitHub.");
    })
    .catch(function () { fail("Network error. Please rejoin the group to retry."); });
})();
</script>
</body>
</html>
